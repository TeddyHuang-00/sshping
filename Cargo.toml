[package]
name = "sshping"
version = "0.5.1"
edition = "2024"
description = "SSH-based ping that measures interactive character echo latency and file transfer throughput. Pronounced \"shipping\"."
authors = ["Nan Huang <teddyhuangnan@gmail.com>"]
license = "MIT"
repository = "https://github.com/TeddyHuang-00/sshping"

[dependencies]
bytesize = "2.7.0"
clap = { version = "4.6.7", features = [
    "derive",
    "string",
    "cargo",
    "color",
    "wrap_help",
] }
clap_complete = { version = "4.6.11", features = ["unstable-dynamic"] }
glob = "0.3.4"
humantime = "2.4.0"
indicatif = "0.18.6"
log = "0.4.35"
num-format = "0.4.4"
rand = "0.10.3"
regex = "1.13.1"
rpassword = "7.5.4"
russh = "0.65.0"
russh-config = "0.58.0"
russh-sftp = "3.0.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
shellexpand = "3.1.2"
simple_logger = "5.2.0"
size = "0.6.0"
tabled = "0.22.0"
tokio = { version = "1.54.0", features = ["full"] }
whoami = "2.1.3"

[build-dependencies]
bytesize = "2.7.0"
clap = { version = "4.6.7", features = [
    "derive",
    "string",
    "cargo",
    "color",
    "wrap_help",
] }
clap_complete = { version = "4.6.11", features = ["unstable-dynamic"] }
clap_mangen = "0.3.3"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
shellexpand = "3.1.2"
tabled = "0.22.0"
whoami = "2.1.3"

[lints.clippy]
nursery = "warn"
